<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubernetes Secret Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .font-mono {
            font-family: 'Roboto Mono', monospace;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 flex items-center justify-center min-h-full p-4 sm:p-6 lg:p-8">
    <div class="w-full max-w-4xl mx-auto">
        <div class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold text-white tracking-tight">Kubernetes Secret Generator</h1>
            <p class="mt-2 text-lg text-gray-400">Enter your credentials below to generate a K8s Secret YAML file.</p>
        </div>

        <div class="bg-gray-800 shadow-2xl rounded-2xl p-6 sm:p-8 grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Input Form Section -->
            <div class="space-y-6">
                <div>
                    <h2 class="text-xl font-semibold text-white border-b-2 border-indigo-500 pb-2 mb-4">Metadata</h2>
                    <div class="space-y-4">
                        <div>
                            <label for="secret-name" class="block text-sm font-medium text-gray-300">Secret Name</label>
                            <input type="text" id="secret-name" value="my-secret" class="mt-1 block w-full bg-gray-700 border-gray-600 rounded-md shadow-sm py-2 px-3 text-white focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                        </div>
                        <div>
                            <label for="namespace" class="block text-sm font-medium text-gray-300">Namespace</label>
                            <input type="text" id="namespace" value="default" class="mt-1 block w-full bg-gray-700 border-gray-600 rounded-md shadow-sm py-2 px-3 text-white focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                        </div>
                    </div>
                </div>

                <div>
                    <h2 class="text-xl font-semibold text-white border-b-2 border-indigo-500 pb-2 mb-4">Credentials (Data)</h2>
                    <div id="credentials-container" class="space-y-3">
                        <!-- Dynamic key-value fields will be added here -->
                    </div>
                    <button id="add-field-btn" type="button" class="mt-4 w-full flex items-center justify-center py-2 px-4 border border-dashed border-gray-500 rounded-md shadow-sm text-sm font-medium text-gray-300 hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 focus:ring-offset-gray-800 transition-all duration-200">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                        Add Field
                    </button>
                </div>
                 <button id="generate-btn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 focus:ring-offset-gray-800 transition-all duration-200">
                    Generate Secret
                </button>
            </div>

            <!-- Output Section -->
            <div class="flex flex-col">
                 <div class="flex justify-between items-center mb-2">
                    <h2 class="text-xl font-semibold text-white">Generated YAML</h2>
                    <button id="copy-btn" class="inline-flex items-center px-3 py-1.5 border border-transparent text-xs font-medium rounded-md shadow-sm text-white bg-gray-600 hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 focus:ring-offset-gray-800">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        Copy
                    </button>
                </div>
                <div class="bg-gray-900 rounded-lg p-4 h-full flex-grow">
                    <pre id="output" class="text-gray-300 text-sm whitespace-pre-wrap break-all h-full font-mono"></pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Element References ---
        const generateBtn = document.getElementById('generate-btn');
        const copyBtn = document.getElementById('copy-btn');
        const addFieldBtn = document.getElementById('add-field-btn');
        const credentialsContainer = document.getElementById('credentials-container');
        const outputEl = document.getElementById('output');
        
        const metadataInputs = {
            secretName: document.getElementById('secret-name'),
            namespace: document.getElementById('namespace'),
        };

        // --- Event Listeners ---
        generateBtn.addEventListener('click', generateSecret);
        copyBtn.addEventListener('click', copyToClipboard);
        addFieldBtn.addEventListener('click', () => addField());
        
        // --- Functions ---

        /**
         * Adds a new key-value input field row to the credentials container.
         * @param {string} key - Optional key to pre-fill.
         * @param {string} value - Optional value to pre-fill.
         */
        function addField(key = '', value = '') {
            const newFieldRow = document.createElement('div');
            newFieldRow.classList.add('flex', 'items-center', 'space-x-2', 'credential-row');
            
            newFieldRow.innerHTML = `
                <input type="text" placeholder="Key" value="${key}" class="flex-1 block w-full bg-gray-700 border-gray-600 rounded-md shadow-sm py-2 px-3 text-white focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm credential-key">
                <input type="text" placeholder="Value" value="${value}" class="flex-1 block w-full bg-gray-700 border-gray-600 rounded-md shadow-sm py-2 px-3 text-white focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm credential-value">
                <button type="button" class="p-2 text-gray-400 hover:text-red-500 remove-field-btn rounded-full hover:bg-gray-700 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            `;
            
            credentialsContainer.appendChild(newFieldRow);

            newFieldRow.querySelector('.remove-field-btn').addEventListener('click', (e) => {
                e.currentTarget.parentElement.remove();
            });
        }

        /**
         * Generates the Kubernetes Secret YAML based on user input.
         */
        function generateSecret() {
            const credentialRows = document.querySelectorAll('.credential-row');
            const data = {};

            credentialRows.forEach(row => {
                const keyInput = row.querySelector('.credential-key');
                const valueInput = row.querySelector('.credential-value');
                const key = keyInput.value.trim();
                const value = valueInput.value.trim();

                if (key) { // Only add if key is present
                    data[key] = btoa(value);
                }
            });

            const secretName = metadataInputs.secretName.value.trim();
            const namespace = metadataInputs.namespace.value.trim();

            let dataString = '';
            for (const key in data) {
                dataString += `  ${key}: ${data[key]}\n`;
            }
            dataString = dataString.trimEnd();

            const yamlString = `apiVersion: v1
kind: Secret
metadata:
  name: ${secretName}
  namespace: ${namespace}
type: Opaque
data:
${dataString || '  # No data provided'}`;

            outputEl.textContent = yamlString;
        }
        
        /**
         * Copies the generated YAML from the output area to the clipboard.
         */
        function copyToClipboard() {
            const textToCopy = outputEl.textContent;
            if (!textToCopy) return;

            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = textToCopy;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            
            try {
                document.execCommand('copy');
                copyBtn.textContent = 'Copied!';
                copyBtn.classList.add('bg-green-600', 'hover:bg-green-700');
                copyBtn.classList.remove('bg-gray-600', 'hover:bg-gray-700');
                
                setTimeout(() => {
                    copyBtn.innerHTML = `<svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg> Copy`;
                    copyBtn.classList.remove('bg-green-600', 'hover:bg-green-700');
                    copyBtn.classList.add('bg-gray-600', 'hover:bg-gray-700');
                }, 2000);
            } catch (err) {
                console.error('Failed to copy text: ', err);
            }
            
            document.body.removeChild(tempTextArea);
        }

        // --- Initial Load ---
        // Add some default fields to guide the user
        addField('username', '');
        addField('password', '');
        generateSecret(); // Generate YAML on page load
    </script>
</body>
</html>
